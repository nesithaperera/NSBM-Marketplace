<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - NSBM Marketplace</title>
<style>
:root{--primary:#006837;--accent:#8cc63f;--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb}
html[data-theme="dark"]{--bg:#111827;--card:#1f2937;--text:#f9fafb;--muted:#9ca3af;--border:#374151}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px;transition:.3s}
.card{width:min(450px,100%);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 10px 25px #0002}
h1{text-align:center;color:var(--primary);margin:0 0 8px}.sub{text-align:center;color:var(--muted);margin-bottom:25px}
label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text)}
button,.back{display:block;width:100%;padding:12px;border:0;border-radius:7px;margin-top:20px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.tools{display:flex;gap:8px;margin-top:12px}.tools button{margin:0;background:transparent;color:var(--text);border:1px solid var(--border)}
</style>
</head>
<body>
<div class="card">
<h1>🟢 Admin Login</h1>
<p class="sub">NSBM Marketplace Admin Portal</p>
<form action="admin_login_process.php" method="POST">
<label for="email">Student Email</label>
<input id="username" name="username" type="text" placeholder="Enter admin username" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" placeholder="Enter your password" required>
<button type="submit">Login</button>
</form>
<a class="back" href="final_fixed.html">← Back to Marketplace</a>
<div class="tools"><button type="button" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button></div>
</div>
<script>
function toggleTheme(){const h=document.documentElement,n=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=n;localStorage.setItem('nsbm-theme',n);update()}
function update(){document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️ Light Mode':'🌙 Dark Mode'}
document.addEventListener('DOMContentLoaded',()=>{document.documentElement.dataset.theme=localStorage.getItem('nsbm-theme')||'light';update()});
</script>
</body>
</html>
